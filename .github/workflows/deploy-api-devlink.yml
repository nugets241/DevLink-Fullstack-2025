name: Deploy API to Azure Web App

on:
  push:
    branches: [main]
    paths:
      - app.js
      - server.js
      - db.js
      - package.json
      - controllers/**
      - middleware/**
      - models/**
      - routes/**
      - utils/**
      - .github/workflows/deploy-api-devlink.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: api-devlink
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
