# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - api-devlink

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install backend dependencies
        run: |
          npm ci

      - name: Install frontend dependencies
        run: |
          npm ci --prefix client

      - name: Build frontend
        run: |
          npm run build --prefix client

      - name: Run frontend tests
        run: |
          npm run test --prefix client

      - name: Run backend tests
        run: |
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_DB9DE3D1E23D4AE497044402048E99C5 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4E21B3D04DD3448CA068078CEE7DEC83 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_49EAEBE5DA604EA09E6026D082EB53C6 }}

      - name: Restart App Service before deployment
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp restart --resource-group api-devlink_group --name api-devlink
            az webapp show --resource-group api-devlink_group --name api-devlink --query "{name:name,state:state,defaultHostName:defaultHostName}" -o table

      - name: 'Deploy to Azure Web App (attempt 1)'
        id: deploy_attempt_1
        continue-on-error: true
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'api-devlink'
          package: .

      - name: Wait before retry
        if: steps.deploy_attempt_1.outcome == 'failure'
        run: sleep 45

      - name: 'Deploy to Azure Web App (attempt 2)'
        if: steps.deploy_attempt_1.outcome == 'failure'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'api-devlink'
          package: .
